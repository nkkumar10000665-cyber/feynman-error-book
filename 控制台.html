<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>控制台 — 费曼错题本Pro</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f0f2f5;--card:#ffffff;--card2:#f8f9fb;--border:#e2e5ea;
    --text:#1a1d29;--text2:#6b7280;--text3:#9ca3af;
    --red:#dc2626;--red-bg:#fef2f2;--red-border:#fecaca;
    --yellow:#d97706;--yellow-bg:#fffbeb;--yellow-border:#fde68a;
    --green:#16a34a;--green-bg:#f0fdf4;--green-border:#bbf7d0;
    --blue:#2563eb;--blue-bg:#eff6ff;--blue-border:#bfdbfe;
    --purple:#7c3aed;--purple-bg:#f5f3ff;--purple-border:#ddd6fe;
    --orange:#ea580c;--orange-bg:#fff7ed;
  }
  body{background:var(--bg);color:var(--text);font-family:"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.6;padding:20px;max-width:1100px;margin:0 auto}
  header{text-align:center;margin-bottom:20px}
  h1{font-size:24px;margin-bottom:4px}
  .subtitle{color:var(--text2);font-size:14px}
  .subtitle .update-time{color:var(--text3)}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
  .stat-box{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .stat-label{font-size:12px;color:var(--text2)}
  .stat-num{font-size:26px;font-weight:700;margin:2px 0}
  .stat-sub{font-size:11px;color:var(--text3)}

  .xp-section{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .xp-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:6px}
  .xp-level{font-size:17px;font-weight:700}
  .xp-level span{color:var(--purple)}
  .xp-num{font-size:13px;color:var(--text2)}
  .xp-bar-bg{height:12px;background:#eef0f4;border-radius:6px;overflow:hidden}
  .xp-bar-fill{height:100%;background:linear-gradient(90deg,#a78bfa,#60a5fa);border-radius:6px}
  .xp-bar-label{display:flex;justify-content:space-between;font-size:11px;color:var(--text3);margin-top:5px}

  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .card-title{font-size:15px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px}
  .card-title .icon{width:26px;height:26px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:14px}

  .todo-list{display:flex;flex-direction:column;gap:8px}
  .todo-item{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border-radius:8px;border:1px solid var(--border);background:var(--card2);font-size:13px}
  .todo-item[data-cmd]{cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .15s}
  .todo-item[data-cmd]:active{background:#eef0f4}
  .todo-item .tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:4px;flex-shrink:0;margin-top:1px}
  .tag-red{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border)}
  .tag-yellow{background:var(--yellow-bg);color:var(--yellow);border:1px solid var(--yellow-border)}
  .tag-blue{background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-border)}
  .todo-text{flex:1}
  .todo-text b{font-weight:600}
  .todo-cmd{color:var(--purple);font-weight:600}
  .empty-hint{text-align:center;padding:14px;color:var(--text3);font-size:13px}

  .action-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .action-btn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 8px;background:var(--card2);border:1px solid var(--border);border-radius:12px;cursor:pointer;font-family:inherit;-webkit-tap-highlight-color:transparent;transition:transform .1s,background .15s}
  .action-btn:active{transform:scale(.96);background:#eef0f4}
  .action-btn .a-icon{font-size:26px}
  .action-btn .a-name{font-size:14px;font-weight:600;color:var(--text)}
  .action-btn .a-sub{font-size:11px;color:var(--text3)}
  .link-row{text-align:center;margin-top:14px}
  .link-btn{display:inline-block;padding:8px 18px;border:1px solid var(--blue);background:var(--blue-bg);color:var(--blue);border-radius:8px;font-size:13px;font-weight:600;text-decoration:none}
  .link-btn:hover{background:var(--blue);color:#fff}

  #toast{position:fixed;left:50%;bottom:36px;transform:translateX(-50%) translateY(20px);background:#1a1d29;color:#fff;font-size:13px;padding:10px 18px;border-radius:8px;opacity:0;pointer-events:none;transition:all .25s;max-width:86%;text-align:center;z-index:99}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  footer{text-align:center;color:var(--text3);font-size:12px;margin-top:20px}

  @media(max-width:768px){
    .stats{grid-template-columns:repeat(2,1fr)}
  }
</style>
</head>
<body>

<header>
  <h1>🎮 费曼错题本Pro · 控制台</h1>
  <p class="subtitle">每天打开这一页就够了 · 状态由 AI 自动更新 <span class="update-time">最后更新：—</span></p>
</header>

<!-- 状态栏（AI自动更新） -->
<div class="stats">
  <div class="stat-box">
    <div class="stat-label">当前XP</div>
    <div class="stat-num" style="color:var(--purple)">—</div>
    <div class="stat-sub"></div>
  </div>
  <div class="stat-box">
    <div class="stat-label">待修复漏洞</div>
    <div class="stat-num" style="color:var(--red)">—</div>
    <div class="stat-sub"></div>
  </div>
  <div class="stat-box">
    <div class="stat-label">超期未复习</div>
    <div class="stat-num" style="color:var(--red)">—</div>
    <div class="stat-sub"></div>
  </div>
  <div class="stat-box">
    <div class="stat-label">待打boss战</div>
    <div class="stat-num" style="color:var(--yellow)">—</div>
    <div class="stat-sub"></div>
  </div>
</div>

<!-- XP进度 -->
<div class="xp-section">
  <div class="xp-header">
    <div class="xp-level">—</div>
    <div class="xp-num"></div>
  </div>
  <div class="xp-bar-bg"><div class="xp-bar-fill" style="width:0%"></div></div>
  <div class="xp-bar-label">
    <span></span>
    <span></span>
    <span></span>
  </div>
</div>

<!-- 今日待办（AI自动更新） -->
<div class="card">
  <div class="card-title"><span class="icon" style="background:var(--red-bg)">📋</span> 现在最该做的事（点击卡片自动复制指令）</div>
  <div class="todo-list">
    <div class="empty-hint">AI 更新后显示今日待办</div>
  </div>
</div>

<!-- 快捷操作 -->
<div class="card">
  <div class="card-title"><span class="icon" style="background:var(--purple-bg)">⚡</span> 快捷操作 · 点击复制指令，粘贴给 AI 就能开始</div>
  <div class="action-grid">
    <button class="action-btn" data-cmd="我要录入错题"><span class="a-icon">📷</span><span class="a-name">录入错题</span><span class="a-sub">拍照发给 AI</span></button>
    <button class="action-btn" data-cmd="开始复习"><span class="a-icon">🔄</span><span class="a-name">开始复习</span><span class="a-sub">艾宾浩斯6轮</span></button>
    <button class="action-btn" data-cmd="开始boss战"><span class="a-icon">⚔️</span><span class="a-name">boss战</span><span class="a-sub">变形题闯关</span></button>
  </div>
  <div class="link-row"><a class="link-btn" href="我的学习/学情总览.html">📊 查看学情总览</a></div>
</div>

<footer>
  费曼错题本Pro · 控制台
</footer>

<div id="toast"></div>

<script>
var toastTimer = null;
function showToast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2200);
}
function copyText(text, okMsg){
  var done = function(){ showToast(okMsg || ('✅ 已复制「' + text + '」，去对话框粘贴发送')); };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(done).catch(function(){ fallback(); });
  } else {
    fallback();
  }
  function fallback(){
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); done(); }
    catch(e) { window.prompt('复制下面这句话发给AI：', text); }
    document.body.removeChild(ta);
  }
}

document.querySelectorAll('.action-btn').forEach(function(btn){
  btn.addEventListener('click', function(){
    copyText(btn.getAttribute('data-cmd'));
  });
});
</script>

<!-- 数据渲染：所有数字来自 data.js，AI 只改那一个文件 -->
<script src="data.js"></script>
<script>
(function(){
  var d = window.APP_DATA;
  if (!d) { console.warn('data.js 未加载'); return; }

  var q = function(s){ return document.querySelector(s); };
  var qa = function(s){ return document.querySelectorAll(s); };

  var ut = q('.update-time');
  if (ut) ut.textContent = '最后更新：' + d.updatedAt;

  var nums = qa('.stat-num'), subs = qa('.stat-sub');
  var statRows = [
    [d.xp.current, d.xp.level + ' · ' + d.xp.title],
    [d.stats.openBugs, d.stats.openBugNote],
    [d.stats.overdueReviews, d.stats.overdueNote],
    [d.stats.pendingBoss, d.stats.bossNote]
  ];
  statRows.forEach(function(row, i){
    if (nums[i]) nums[i].textContent = row[0];
    if (subs[i]) subs[i].textContent = row[1];
  });

  var lv = q('.xp-level');
  if (lv) lv.innerHTML = d.xp.level + ' · <span>' + d.xp.title + '</span>';

  var span = d.xp.levelEnd - d.xp.levelStart;
  var gained = d.xp.current - d.xp.levelStart;
  var xn = q('.xp-num');
  if (xn) xn.textContent = d.xp.current + ' XP · 本级 ' + gained + ' / ' + span;

  var bar = q('.xp-bar-fill');
  if (bar) bar.style.width = Math.round(gained / span * 100) + '%';

  var labels = qa('.xp-bar-label span');
  if (labels.length === 3) {
    labels[0].textContent = d.xp.levelStart + ' ' + d.xp.level;
    labels[1].textContent = '距升级还差 ' + (d.xp.levelEnd - d.xp.current) + ' XP';
    labels[2].textContent = d.xp.levelEnd + ' ' + d.xp.nextLevel;
  }

  var tl = q('.todo-list');
  if (tl && d.todos) {
    if (!d.todos.length) {
      tl.innerHTML = '<div class="empty-hint">今天没有待办，自由安排 🎉</div>';
    } else {
      tl.innerHTML = d.todos.map(function(t){
        return '<div class="todo-item"' + (t.cmd ? ' data-cmd="' + t.cmd + '"' : '') +
          '><span class="tag tag-' + t.color + '">' + t.tag +
          '</span><div class="todo-text">' + t.text +
          (t.cmd ? '<br><span class="todo-cmd">👆 点击复制：' + t.cmd + '</span>' : '') +
          '</div></div>';
      }).join('');
      tl.querySelectorAll('.todo-item[data-cmd]').forEach(function(item){
        item.addEventListener('click', function(){
          copyText(item.getAttribute('data-cmd'));
        });
      });
    }
  }
})();
</script>

</body>
</html>
